
# ==========================================
# USER SERVICE - AIRLINE BOOKING SYSTEM
# ==========================================

server:
  port: ${USER_SERVICE_PORT:8083}

spring:
  config:
    import:
      - optional:file:./infra/.env[.properties]
      - optional:file:../../infra/.env[.properties]
  application:
    name: user-service

  # POSTGRESQL DATABASE
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://127.0.0.1:5432/user_db}
    username: ${USER_DB_USERNAME:postgres}
    password: ${USER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD:guest}

  # SPRING DATA JPA / HIBERNATE
  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# JWT AUTHENTICATION
app:
  jwt:
    issuer: airline-booking-user-service
    secret: ${USER_JWT_SECRET}
    expiration-seconds: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# LOGGING
logging:
  level:
    root: INFO
    com.group3: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
