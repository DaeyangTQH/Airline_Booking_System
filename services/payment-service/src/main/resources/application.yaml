spring:
  config:
    import:
      # Shared env: infra/.env (cwd = repo root hoặc module)
      - optional:file:./infra/.env[.properties]
      - optional:file:../../infra/.env[.properties]

  application:
    name: payment-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ApplicationHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
          booking-service:
            connect-timeout: 3000
            read-timeout: 5000

server:
  port: ${PAYMENT_SERVICE_PORT:8084}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30


app:
  internal-api-key: ${INTERNAL_API_KEY}
  sepay:
    merchant-id: ${SEPAY_MERCHANT_ID:}
    secret-key: ${SEPAY_SECRET_KEY:}
    checkout-init-url: ${SEPAY_CHECKOUT_INIT_URL:https://pay-sandbox.sepay.vn/v1/checkout/init}
    callback-base-url: ${SEPAY_CALLBACK_BASE_URL:http://localhost:8084}
    frontend-return-url: ${SEPAY_FRONTEND_RETURN_URL:http://localhost:5173/payment-return}
    payment-method: ${SEPAY_PAYMENT_METHOD:BANK_TRANSFER}
    currency: ${SEPAY_CURRENCY:VND}
    lang: ${SEPAY_LANG:vi}
