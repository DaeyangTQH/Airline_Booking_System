server:
  port: ${BOOKING_SERVICE_PORT}
spring:
  config:
    import:
      - optional:file:./infra/.env[.properties]
      - optional:file:../../infra/.env[.properties]
  application:
    name: booking-service

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  datasource:
    url: ${BOOKING_DB_URL}
    username: ${BOOKING_DB_USERNAME}
    password: ${BOOKING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  cloud:
    openfeign:
      client:
        config:
          flight-search-service:
            connectTimeout: 3000
            readTimeout: 5000

          payment-service:
            connectTimeout: 3000
            readTimeout: 5000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  internal-api-key: ${INTERNAL_API_KEY}

  messaging:
    notification-queue: ${NOTIFICATION_QUEUE:notification_queue}

  outbox:
    fixed-delay-ms: ${OUTBOX_FIXED_DELAY_MS:5000}
    max-retries: ${OUTBOX_MAX_RETRIES:5}

  booking-expiration:
    fixed-delay-ms: ${BOOKING_EXPIRATION_FIXED_DELAY_MS:60000}