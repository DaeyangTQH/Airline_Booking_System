server:
  port: ${FLIGHT_SEARCH_SERVICE_PORT:8081}
spring:
  config:
    import:
      - optional:file:./infra/.env[.properties]
      - optional:file:../../infra/.env[.properties]
  application:
    name: flight-search-service

  datasource:
    url: ${FLIGHT_SEARCH_DB_URL}
    username: ${FLIGHT_SEARCH_DB_USERNAME}
    password: ${FLIGHT_SEARCH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false