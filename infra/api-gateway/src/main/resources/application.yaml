server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            # User Service (8081)
            - id: user-service-auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**

            - id: user-service-users
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

            - id: user-service-passengers
              uri: lb://user-service
              predicates:
                - Path=/api/passengers/**

            - id: user-service-admin
              uri: lb://user-service
              predicates:
                - Path=/api/admin/**

            # Booking Service (8082)
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/**,/api/v1/tickets/**

            # Notification Service
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/reminders/**

            # Payment Service (8084) — public VNPay callback / payment APIs
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**

# JWT — cùng secret/issuer với user-service
app:
  jwt:
    issuer: airline-booking-user-service
    secret: ${USER_JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
