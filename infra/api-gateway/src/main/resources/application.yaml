spring:
  config:
    import:
      - optional:file:./infra/.env[.properties]
      - optional:file:../.env[.properties]

  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: user-service-auth
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**

            - id: user-service-users
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

            - id: flight-search-service
              uri: lb://flight-search-service
              predicates:
                - Path=/api/v1/airports,/api/v1/flights,/api/v1/flights/**

            - id: user-service-passengers
              uri: lb://user-service
              predicates:
                - Path=/api/passengers/**

            - id: user-service-admin
              uri: lb://user-service
              predicates:
                - Path=/api/admin/**

            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/**,/api/v1/tickets/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/reminders/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**

server:
  port: 8080

# JWT — cùng secret/issuer với user-service
app:
  jwt:
    issuer: airline-booking-user-service
    secret: ${USER_JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
